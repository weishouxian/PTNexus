# Rousi（肉丝）站点配置 —— PeerGo 平台发种映射
#
# 说明：
# - 肉丝已升级为 PeerGo 平台：旧的 API v1（Bearer passkey + JSON）全部作废，站点也不提供 API Key。
#   现在发种走 POST /api/v1/torrents（multipart），认证用浏览器会话 Cookie：
#   站点配置的 passkey 字段填 __Host-peergo_session 的值（或整段 `__Host-peergo_session=xxx`）。
#   Cookie 会过期，发种报「会话 Cookie 无效或已过期」时到浏览器重新复制即可。
# - 分类走 category_id（movies/tv/anime/...），填表维度由站点按分类下发，
#   本文件只负责「标准化值 → 站点取值」的换算；站点下发的选项里没有的值会被自动丢弃。
# - genre_options_by_type 是维度接口不可用时的降级数据，key 必须用站点分类 id。

site_name: "Rousi"

mappings:
  # 标准化类型 → 站点 category_id
  type:
    "category.movie": "movies"
    "category.animation": "anime"
    "category.tv_series": "tv"
    "category.tv_shows": "variety"
    "category.documentaries": "documentary"
    "category.music": "music"
    "category.mv": "music"
    "category.sports": "sports"
    "category.software": "software"
    "category.ebook": "ebooks"
    "category.game": "other"
    "category.other": "other"
    "default": "other"

  # 产地 → 站点 region 选项 key
  region:
    "source.china": "mainland-china"
    "source.hongkong": "hong-kong"
    "source.taiwan": "taiwan"
    "source.japan": "japan"
    "source.korea": "south-korea"
    "source.western": "usa"
    "source.usa": "usa"
    "source.uk": "uk"
    "source.france": "france"
    "source.germany": "germany"
    "source.italy": "italy"
    "source.spain": "spain"
    "source.russia": "russia"
    "source.canada": "canada"
    "source.newzealand": "new-zealand"
    "source.india": "india"
    "source.thailand": "thailand"
    "source.australia": "australia"
    "default": "other"

  # 分辨率 → 站点 resolution 选项 key
  resolution:
    "resolution.r2160p": "2160p"
    "resolution.r1080p": "1080p"
    "resolution.r1080i": "1080i"
    "resolution.r720p": "720p"
    "resolution.sd": "sd"
    "resolution.other": "other"
    "default": "other"

