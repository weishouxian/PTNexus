# 标签（labelsNew）：站点标签表来自 /api/system/getConf 的 TORRENT_LABEL_CONFIG。
# 4k/8k/hdr/hdr10/hdr10+/hlg/DoVi/HDRVi 是技术标签（站点前端本会按 mediainfo 自动补），
# 中字/中配/AI破解 是用户可选标签。键为 PTNexus 标签名（比较时忽略大小写与 tag. 前缀）。
tags:
  "4K": "4k"
  "8K": "8k"
  "HDR": "hdr"
  "HDR10": "hdr10"
  "HDR10+": "hdr10+"
  "HLG": "hlg"
  "DV": "DoVi"
  "杜比": "DoVi"
  "菁彩HDR": "HDRVi"
  "中字": "中字"
  "国语": "中配"
  "中配": "中配"

# 兜底值：仅当标准化值缺失或未命中时使用。
defaults:
  category: "409"   # Misc(其他)
  source: "6"       # Other
  standard: "1"     # 站点无 Other，回落最常见的 1080p
  video_codec: "1"  # 站点无 Other，回落最常见的 H.264
  audio_codec: "7"  # Other
  processing: "6"   # OT
