  "source.denmark": "10"
  "source.russia": "3"
  "source.japan": "17"
  "source.korea": "30"
  "source.australia": "20"
  "source.brazil": "18"
  "source.india": "70"
  "source.singapore": "26"
  "source.malaysia": "40"
