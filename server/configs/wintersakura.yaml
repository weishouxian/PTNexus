mappings:
  # type（影视区 browsecat / mode_4）:
  #   401=Movies/电影 402=TV Series/剧集(分集) 414=TV Series/剧集(合集)
  #   413=Animation series/动漫剧集(分集) 423=Animation series/动漫剧集(合集) 422=Animation flims/动漫电影
  #   403=TV Shows/综艺(合集) 418=TV Shows/综艺(分集) 410=Documentaries/纪录片
  #   406=Music Videos/音乐MV 408=HQ Audio/无损音乐 407=Sports/体育 409=Misc/其他
  #   非影视区 specialcat(mode_5): 424=课程 425=数据/数据库 426=期刊/论文 427=软件/程序/代码 428=图书
  #
  # 剧集/综艺/动漫默认走「合集」分类（414/403/423）：本站在 sites_data.json 里
  # allow_episode_publish=false，带「分集」标签的资源在发布前就被拦截，
  # 能发出去的基本都是合集；若以后放开分集，需要改回 402/418/413。
  # 标准值无法区分「动漫剧集」与「动漫电影」，统一归 423；动漫电影(422) 需人工调整。
  type:
    "category.movie": "401"
    "category.tv_series": "414"
    "category.tv_pack": "414"
    "category.animation": "423"
    "category.cartoon": "423"
    "category.tv_shows": "403"
    "category.documentaries": "410"
    "category.sports": "407"
    "category.mv": "406"
    "category.music": "408"
    "category.stage": "409"
    "category.other": "409"
    "category.ebook": "428"
    "category.software": "427"
    "category.study": "424"
    "category.game": "409"
    "default": "401"

  # medium_sel[4] 媒介: 10=UHD Blu-ray 11=UHD Blu-ray/DIY 12=Blu-ray 13=Blu-ray/DIY 14=Remux
  #   15=Encode 16=HDTV 17=DVDR 18=CD 21=WEB-DL 22=SACD 23=HD DVD 24=3D Blu-ray 25=Webrip
  # 站内没有 Other 选项，兜底用最常见的 WEB-DL(21)。
  medium:
    "medium.uhd_bluray": "10"
    "medium.uhd_diy": "11"
    "medium.bluray": "12"
    "medium.bluray_diy": "13"
    "medium.minibd": "13"
    "medium.remux": "14"
    "medium.encode": "15"
    "medium.encode_2160p": "15"
    "medium.encode_1080p": "15"
    "medium.encode_720p": "15"
    "medium.hdtv": "16"
    "medium.dvd": "17"
    "medium.dvdr": "17"
    "medium.cd": "18"
    "medium.webdl": "21"
    "medium.sacd": "22"
    "medium.hddvd": "23"
    "medium.webrip": "25"
    "medium.other": "21"
    "default": "21"

  # codec_sel[4] 视频编码: 6=H264/AVC 7=x265 8=x264 9=H265/HEVC 10=VC-1 11=MPEG-2 15=ProRes 16=AV1 13=Other
  # 本站把 x264 与 H264/AVC、x265 与 H265/HEVC 分开列出，按标准值精确落位。
  video_codec:
    "video.h264": "6"
    "video.x264": "8"
    "video.h265": "9"
    "video.x265": "7"
    "video.hevc": "9"
    "video.av1": "16"
    "video.vc1": "10"
    "video.mpeg2": "11"
    "video.other": "13"
    "default": "13"

  # audiocodec_sel[4] 音频编码: 8=DTS-HDMA 9=DTS-HDMA:X 7.1 10=TrueHD Atmos 11=PCM 12=TrueHD 13=DTS
  #   14=LPCM 15=FLAC 16=APE 17=MP3 18=OGG 19=AAC 20=AC3/DD 21=Other 22=DTS-HD HR
  #   23=WAV 24=DSD 25=Dolby Digital Plus 26=DDP Dolby Atmos 27=Opus
  audio_codec:
    "audio.truehd": "12"
    "audio.truehd_atmos": "10"
    "audio.dts_hd_ma": "8"
    "audio.dts_hd": "8"
    "audio.dts_hd_hr": "22"
    "audio.dtsx": "9"
    "audio.dts": "13"
    "audio.ac3": "20"
    "audio.ddp": "25"
    "audio.ddp_atmos": "26"
    "audio.aac": "19"
    "audio.flac": "15"
    "audio.ape": "16"
    "audio.lpcm": "14"
    "audio.mp3": "17"
    "audio.ogg": "18"
    "audio.opus": "27"
    "audio.wav": "23"
    "audio.other": "21"
    "default": "21"

  # standard_sel[4] 分辨率: 1=2K/1080p 2=1080i 3=720p 4=SD 5=4K/2160p 6=8K/4320p
  # 站内没有 Other，兜底用最常见的 1080p(1)。
  resolution:
    "resolution.r1080p": "1"
    "resolution.r1080i": "2"
    "resolution.r720p": "3"
    "resolution.sd": "4"
    "resolution.r2160p": "5"
    "resolution.r4320p": "6"
    "resolution.other": "1"
    "default": "1"

  # team_sel[4] 制作组: 5=Other 6=CMCT 7=FRDS 8=PTer 9=BHD 13=Mteam 14=HDC 15=ttg 17=tjupt
  #   1=HDS 2=CHD 18=Sakura WEB 16=WScode 11=WS 12=Sakura SUB 19=Sakura Academic
  team:
    "team.hds": "1"
    "team.chd": "2"
    "team.cmct": "6"
    "team.frds": "7"
    "team.pter": "8"
    "team.beyondhd": "9"
    "team.mteam": "13"
    "team.hdc": "14"
    "team.ttg": "15"
    "team.tjupt": "17"
    "team.other": "5"
    "default": "5"

  # tags[4][] 标签: 2=首发 16=独占 1=禁转 4=DIY 5=国语 12=粤语 6=中字
  #   8=原创字幕 9=特效字幕 7=HDR10 10=HDR10+ 11=HDR+杜比视界 22=原生原盘 21=子供向
  #   17=豆瓣电影Top250 18=IMDb Top250 19=标准收藏版
  # 本站只有「HDR+杜比视界」这一组合标签表达 Dolby Vision，故 tag.杜比 落这里。
  tag:
    "tag.首发": "2"
    "tag.禁转": "1"
    "tag.DIY": "4"
    "tag.国语": "5"
    "tag.粤语": "12"
    "tag.中字": "6"
    "tag.简繁中字": "6"
    "tag.特效": "9"
    "tag.特效字幕": "9"
    "tag.HDR10": "7"
    "tag.HDR10+": "10"
    "tag.杜比": "11"
    "tag.杜比视界": "11"
    "tag.原生": "22"
    "default": null
