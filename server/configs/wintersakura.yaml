site_name: "WinterSakura 冬樱"

# WinterSakura (wintersakura.net) 发种映射配置
# 抓取来源: https://wintersakura.net/upload.php （登录态实测）
# 表单: action=takeupload.php method=post enctype=multipart/form-data，种子文件字段 file
# 页面必填项(带 *): 种子文件、简介(descr)、类型(type)
#
# 关键差异:
#   1) 两个同名 name=type 的 select，靠前端 data-mode 二选一（jQuery 显示 tr[relation=mode_<data-mode>]）:
#        id=browsecat  data-mode=4 → 影视区 401-423
#             配套字段 medium_sel[4] / codec_sel[4] / audiocodec_sel[4] / standard_sel[4] / team_sel[4] / tags[4][]
#        id=specialcat data-mode=5 → 非影视区 424-428
#             配套字段 custom_fields[5][1][]（图形标签）/ custom_fields[5][2]（课程分类）/ tags[5][]
#      本配置只发影视区 mode_4 那一套；两者互斥，绝不能同时提交。
#   2) 无 source_sel / processing_sel（站内没有地区字段），故不配 source —— 运行时自动跳过。
#   3) 标签是 tags[4][] 数组（21 项），不是独立 checkbox。
#   4) 外链: url = IMDb 链接；pt_gen = PT-Gen 外链（豆瓣链接填这里）；无 dburl。
#   5) MediaInfo/BDInfo 有独立字段 technical_info（不并入简介），保持 Public 默认行为即可。
#   6) 无 uplver/匿名字段 —— 站点不支持匿名发种；不配 anonymous，引擎默认兜底提交的 uplver 会被站点忽略（同 pthome/ptfans）。

upload_file_field: "file"

# dupe 校验（发布前查重）。仅当站点设置里开启「dupe 校验」时生效。
# 实测 https://wintersakura.net/torrents.php：
#  - search_area 只有 0=标题 / 1=简介 / 3=发布者 / 4=IMDB链接，**没有豆瓣范围**（同猫站）。
#  - 搜索页只有 cat{N} / search / search_area / incldead / spstate 五类筛选，
#    没有 medium/source/codec/standard/team 筛选参数，故 param_templates 只声明 type（cat401=1 实测形态）。
dupe_check:
  enabled: true
  search_path: "torrents.php"
  search_area_param: "search_area"
  search_areas:
    imdb: "4"
    title: "0"
  param_templates:
    type: "cat{value}"

form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  audio_codec: "audiocodec_sel[4]"
  resolution: "standard_sel[4]"
  team: "team_sel[4]"
  name: "name"
  small_descr: "small_descr"
  description: "descr"
  imdb_url: "url"                  # IMDb 链接文本框
  pt_gen: "pt_gen"                 # PT-Gen 外链（豆瓣链接会填这里）
  technical_info: "technical_info" # MediaInfo/BDInfo 独立字段
  "tags[4][]": "tags[4][]"

