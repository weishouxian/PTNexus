    "team.chdbits": "14"
    "team.chd": "14"
    "team.sgnb": "13"
    "team.remux": "1"
    "team.chdtv": "2"
    "team.chdpad": "15"
    "team.chdweb": "12"
    "team.chdhktv": "11"
    "team.onehd": "8"
    "team.blucook": "16"
    "team.kan": "19"
    "team.jkct": "22"
    "team.bmdru": "23"
    "team.destiny": "25"
    "team.sp": "26"
    "team.grasstv": "27"
    "team.chdbpm": "28"
    "team.grammyfan": "29"
    "team.other": "3"
    "default": "3"

# 标签决定分类：带"动画/动漫"标签的种子必须归入 405=Animations，
# 覆盖按来源文本解析出的类型（例如来源站把动画剧集解析成"电视剧/402"）。
# 值为标准类型值，经上面 mappings.type 换算成站点取值（命中即覆盖，不走 default 兜底）。
type_by_tag:
  "tag.动画": "category.animation"
  "tag.动漫": "category.animation"
