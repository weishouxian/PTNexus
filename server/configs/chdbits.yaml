    "source.western": "3"
    "source.japan": "4"
    "source.hongkong": "5"
    "source.hongkong_taiwan": "5"
    "source.korea": "6"
    "source.uk": "7"
    "source.china": "8"
    "source.taiwan": "9"
    "source.singapore": "10"
    "source.malaysia": "11"
    "source.europe": "3"
    "source.australia": "3"
    "source.canada": "3"
    "source.india": "3"
    "source.other": "3"
    "default": "3"

  # team_sel: 3=压制组 14=CHDBits 13=SGNB 1=REMUX 2=CHDTV 15=CHDPAD 12=CHDWEB
  #           11=CHDHKTV 8=OneHD 16=blucook 19=KAN 22=JKCT 23=BMDru
  #           25=Destiny 26=SP 27=GrassTV 28=CHDBPM 29=GrammyFan
  #   站点无 Other 制作组，未知制作组回落 压制组(3)
