site_name: "CHDBits"

# 彩虹岛 (CHDBits, ptchdbits.co) 发种映射配置
# 抓取来源: https://ptchdbits.co/upload.php  (2026-09-21 登录态实测)
# 表单: action=takeupload.php  method=post  enctype=multipart/form-data
#
# 关键差异（与其它已接入 NexusPHP 站点不同处）:
#   1. 文件字段是 torrentfile，不是 NexusPHP 标准的 file
#   2. select 字段名【不带】[N] 后缀（同 pthome/ourbits，不同于 aling/mypt/lemon/1ptba）
#   3. 分类 type 走 401+ 段位，不是从 1 开始：
#      401=电影 402=电视剧 403=TV Shows 404=纪录片 405=动画
#      406=音乐 407=体育 408=HQ Audio 409=Demo 410=游戏
#   4. 地区字段是 processing_sel（美剧/日剧/港剧/韩剧/英剧/国剧/台剧/新剧/马剧/合集/3D）；
#      另有一个 source_sel 是「来源性质」（1=官方 7=转载 8=复活区 9=原创），
#      与 PTNexus 的 source.*（地区）语义无关，故用 static_fields 固定提交 7=转载
#   5. 标签是 8 个【独立 checkbox】（name 各自独立、value 均为 yes），
#      不是其它站的 tags[] 数组，无法用 mappings.tag 表达，改走 checkbox_tags 表
#   6. 站点无 DVD/Other 媒介：未知媒介回落 Encode(4)；
#      分辨率有 Other(5)，未知分辨率直接兜底到 Other
#   7. 无 pt_gen、无 dburl，只有 url（IMDb 链接文本框）；无 CD/DVD 之外的豆瓣字段
#   8. 带"动画/动漫"标签的种子强制归入 405=Animations（见文末 type_by_tag）

upload_file_field: "torrentfile"

form_fields:
  category: "type"
  medium: "medium_sel"
  video_codec: "codec_sel"
  audio_codec: "audiocodec_sel"
  resolution: "standard_sel"
  # 地区/剧种：PTNexus 的 source.*（source.china 等）落在这个字段
  processing: "processing_sel"
  team: "team_sel"
  name: "name"
  small_descr: "small_descr"
  description: "descr"
  imdb_url: "url"

# 站点固定字段：无语义映射来源的必填字段的默认值（已由其它映射命中的字段不会被覆盖）
# source_sel 期望 1=官方 / 7=转载 / 8=复活区 / 9=原创，默认按转载提交
static_fields:
  source_sel: "7"

# 独立 checkbox 型标签：PTNexus 标准标签值 → 站点 checkbox 字段名
# 命中即提交 <字段名>=yes；未命中不提交该字段（服务端视为未勾选）
checkbox_tags:
  "tag.官方": "perent"
  "tag.官组": "perent"
  "tag.官字": "perent"
  "tag.首发": "first"
  "tag.禁转": "oneself" # 全局映射里「独占」的标准值就是 tag.禁转
  "tag.独家": "oneself"
  "tag.国语": "cnlang"
  "tag.DIY": "diy"
  "tag.中字": "cnsub"
  "tag.限转": "limited"
  "tag.特效": "txsub"

