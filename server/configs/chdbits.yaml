mappings:
  # type: 401=Movies 404=Documentaries 405=Animations 402=TV Series 403=TV Shows
  #       406=Music 407=Sports 409=Demo 408=HQ Audio 410=Game
  #   Demo(409) 属罕见分类，标准枚举无对应值，不映射；其余无语义分类回落 401
  type:
    "category.movie": "401"
    "category.movie_3d": "401"
    "category.blu_ray": "401"
    "category.top100": "401"
    "category.top250": "401"
    "category.tv_series": "402"
    "category.tv_pack": "402"
    "category.drama": "402"
    "category.playlet": "402"
    "category.tv_shows": "403"
    "category.documentaries": "404"
    "category.document": "404"
    "category.animation": "405"
    "category.cartoon": "405"
    "category.music": "406"
    "category.mv": "406"
    "category.stage": "406"
    "category.sports": "407"
    "category.audio": "408"
    "category.game": "410"
    "category.other": "401"
    "default": "401"

  # medium_sel: 1=Blu-ray 19=UHD Blu-ray 3=Remux 4=Encode 6=HDTV 18=WEB-DL 8=CD
  #   站点无 DVD / Other，DVD 系与其它未知媒介回落 Encode(4)
  medium:
    "medium.bluray": "1"
    "medium.bluray_diy": "1"
    "medium.uhd_bluray": "19"
    "medium.uhd_diy": "19"
    "medium.remux": "3"
    "medium.encode": "4"
    "medium.minibd": "4"
    "medium.bdrip": "4"
    "medium.hdtv": "6"
    "medium.uhdtv": "6"
    "medium.tv": "6"
    "medium.tvrip": "6"
    "medium.webdl": "18"
    "medium.webrip": "18"
    "medium.cd": "8"
    "medium.track": "8"
    "medium.sacd": "8"
    "medium.vinyl": "8"
    "default": "4"

  # codec_sel: 1=H.264/AVC 5=H.265 6=MPEG-4 4=MPEG-2 2=VC-1 3=AV1
  #   站点无 Other 编码，未知编码回落 MPEG-4(6)
  video_codec:
    "video.h264": "1"
    "video.x264": "1"
    "video.h265": "5"
    "video.x265": "5"
    "video.hevc": "5"
    "video.av1": "3"
    "video.mpeg2": "4"
    "video.mpeg4": "6"
    "video.vc1": "2"
    "video.xvid": "6"
    "video.other": "6"
    "default": "6"

  # audiocodec_sel: 3=DTS 7=AC3 10=DTS-HD 11=True-HD 13=LPCM
  #                 1=FLAC 2=APE 12=WAV 6=AAC 14=ALAC
  #   站点无 MP3/Other 项，未知音频回落 AC3(7)
  audio_codec:
    "audio.dts": "3"
    "audio.ac3": "7"
    "audio.ddp": "7"
    "audio.ddp_atmos": "7"
    "audio.dts_hd_ma": "10"
    "audio.dts_hd": "10"
    "audio.dts_hd_hr": "10"
    "audio.dtsx": "10"
    "audio.truehd": "11"
    "audio.truehd_atmos": "11"
    "audio.lpcm": "13"
    "audio.pcm": "13"
    "audio.flac": "1"
    "audio.ape": "2"
    "audio.wav": "12"
    "audio.aac": "6"
    "audio.alac": "14"
    "audio.m4a": "6"
    "audio.other": "7"
    "default": "7"

  # standard_sel: 1=1080p 2=1080i 3=720p 5=Other 7=8K 6=4K（无 SD 项）
  resolution:
    "resolution.r1080p": "1"
    "resolution.r1080i": "2"
    "resolution.r720p": "3"
    "resolution.r1440p": "5"
    "resolution.r2160p": "6"
    "resolution.r4320p": "7"
    "resolution.sd": "5"
    "resolution.r480p": "5"
    "resolution.r540p": "5"
    "resolution.other": "5"
    "default": "5"

  # processing_sel: 1=3D 3=美剧 4=日剧 5=港剧 6=韩剧 7=英剧 8=国剧 9=台剧 10=新剧 11=马剧 13=合集
  # 站点无「其它地区」项，未知地区回落 美剧(3)
