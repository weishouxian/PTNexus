site_name: "PTFans"

# PTFans (ptfans.cc) 发种映射配置
# 抓取来源: https://ptfans.cc/upload.php (登录态实测)
# 表单: action=takeupload.php method=post enctype=multipart/form-data
# 文件字段: file
# 关键差异:
#   1) select 字段名带 [4] 后缀(同 aling/mypt/lemon/1ptba/agsv); 页面另有一套 [5] 后缀字段
#      (specialcat 成人区 420-429), 二者由两个 name=type 的 select 的 data-mode 前端二选一显示
#      (jQuery 显示 tr[relation=mode_<data-mode>]), 引擎只发普通区 mode_4 那一套
#   2) 无 audiocodec_sel, 无 source_sel(地区/来源字段都没有) —— 不配, 运行时自动跳过
#   3) 标签是 tags[4][] 数组, 8=DoVi 1=禁转 2=首发 4=DIY 5=国语 6=中字 7=HDR (仅 7 项)
#   4) 外链: url 是 IMDb 链接文本框; pt_gen 是 PT-Gen(imdb/douban/bangumi/indienova) 链接; 无 dburl
#   5) MediaInfo 有独立字段 technical_info(不并入简介)
#   6) 站点无 uplver/匿名字段 —— 不支持匿名发种; 不配 anonymous, 引擎默认兜底提交的 uplver
#      会被服务端忽略, 不影响发种(同 pthome)
#   7) 另有 qch_bt_rainbow_enable(彩虹标题, 消耗魔力) —— 不提交, 保持站点默认

upload_file_field: "file"

form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  resolution: "standard_sel[4]"
  team: "team_sel[4]"
  name: "name"
  small_descr: "small_descr"
  description: "descr"
  imdb_url: "url"                 # IMDb 链接文本框
  pt_gen: "pt_gen"                # PT-Gen 外链(豆瓣链接会填这里)
  technical_info: "technical_info" # MediaInfo 独立字段
  "tags[4][]": "tags[4][]"

