# 可乐PT（www.colapt.com）站点配置
#
# ⚠️ 本站不是 NexusPHP，本文件也不是 NexusPHP 的 form_fields 结构，而是 colapt.go 的专属字典。
#    站点形态（实测 2026-10-22）：
#      - 前端是 Vite 打包的纯 SPA（/upload 等页面全部走 hash 之外的 history 路由，未登录直接跳 /login），
#        没有任何 upload.php / takeupload.php 表单，通用 NexusPHP 发布器（PublishPublic）完全用不上。
#      - 后端是自研 JSON API：统一前缀 /api/v1，契约版本 17.75.4（内嵌 openapi 3.4.0 描述），
#        错误体统一为 {"error":{"code","message","fields","request_id"}}。
#      - 鉴权有两种，用途不同、不能互相替代（实测 2026-10-31）：
#          a) 浏览器 Cookie：reelcore_session=<64 位 hex>，走网页版 /api/v1/torrents/*，只要账号是成员就能读。
#             ⚠️ 只有 reelcore_session_marker 是设备标记，不带身份，单发它一律 401 authentication_required。
#          b) API Key：请求头 X-API-Key，走 /api/v1/automation/*，用于发种（上传/写元数据/提交）。
#             契约里 ApiKey.scopes 的枚举只有 torrent.upload 与 mtorrent.compat，没有任何读权限；
#             账号未获「自动发种」资格时 scopes 为空，连上传都回 403 api_key_scope_denied。
#        ⇒ PTNexus 的分工：抓源站数据用 Cookie（站点设置 Cookie 栏），发种用 API Key（Passkey 栏）。
#          Key 被站点拒（403 api_key_scope_denied）时发种会自动降级用同一个 Cookie 走网页版
#          /api/v1/torrents（去掉 /automation 段），只需账号有 torrent.upload 权限——
#          实测 2026-10-31：带 CSRF 向该端点 POST 垃圾内容返回 400 invalid_torrent（而非 401/403），
#          说明会话通道有写权限；账号的 /me/automation-access 为 eligible=false、
#          reason="管理员尚未开放自助申请。"，故 Key 通道在站方授权前不可用。
#      - 发种是「三段式」而不是一次表单提交：
#          1) POST /api/v1/automation/torrents                     上传 .torrent（body 直接是种子二进制）→ 得到草稿 id/revision
#          2) PUT  /api/v1/automation/torrents/{id}/metadata       写字段（JSON，带 expected_revision 做乐观锁）
#          3) POST /api/v1/automation/torrents/{id}/submit         关联作品（media_id 或 new_media）后提交
#        提交后不一定是已发布：publication_stage / status 回传站点侧阶段（可能进审核队列），日志里会标出来。
#
#   字段口径与 NexusPHP 站最大的差异：
#      - 站点没有「产地/地区」字段；它的 `source` 是【片源类型】（下拉，取值见下方 medium 字典），
#        也就是别的站的「媒介」。PTNexus 的 medium → 站点 source，别按产地理解。
#      - 分类（movie/tv/anime/variety/other）挂在「作品」上（media 实体），不挂在种子上；
#        种子只描述版本（分辨率/编码/音轨/片源类型/季集范围）。
#      - 音轨 audio 是自由文本（表单提示「例如 AAC 2.0, DTS-HD MA 5.1」），不是枚举。
#      - 字幕只有 zh/en/ja/other 四个码，最多 4 个。
#      - 标签由站点按作品+版本自动派生，接口不可写（契约原文：Derived tags are not writable）。
#      - 查重由站点服务端强制（同作品同发布范围组内，低于已有画质 → 409 dupe_lower_quality；
#        同档位 → 只回 warning 不拒绝）。站点没有「列表检索」公开端点，故本文件不提供 dupe_check 段，
#        dupe 校验交给站点自身裁决，命中时按「站点硬性拒绝」记为跳过。
site_name: "ColaPT"

# ===== 接口 =====
api_base: "https://www.colapt.com"
api_key_header: "X-API-Key"
upload_path: "/api/v1/automation/torrents"
torrent_path: "/api/v1/automation/torrents/{id}"
metadata_path: "/api/v1/automation/torrents/{id}/metadata"
submit_path: "/api/v1/automation/torrents/{id}/submit"
# 发布成功后对外给出的详情页地址（站点 SPA 路由）
publish_page: "/torrents/{id}"

# 是否匿名发布（提交时传 anonymous）
anonymous: false

# ===== 字典 =====
# 字典真源：站点上传页前端字典（assets/upload-layout-*.js，2026-10-22 抓取）。
# 下拉框都带一个「未知」占位，未命中一律回落它，绝不编造站点不认的值。

# 站点「片源类型」（API 字段 source）—— 不是产地！
medium:
  "medium.bluray": "Blu-ray Disc"
  "medium.uhd_bluray": "Blu-ray Disc"
  "medium.bluray_disc": "Blu-ray Disc"
  "medium.uhd_diy": "DIY原盘"
  "medium.diy": "DIY原盘"
  "medium.remux": "Remux"
  "medium.uhd_remux": "Remux"
  "medium.bluray_remux": "Remux"
  "medium.encode": "Blu-ray"
  "medium.bluray_encode": "Blu-ray"
  "medium.bdrip": "BDRip"
  "medium.bd25": "BDRip"
  "medium.minibd": "BDRip"
  "medium.webdl": "WEB-DL"
  "medium.webrip": "WEBRip"
  "medium.feed": "WEBRip"
  "medium.hdtv": "HDTV"
  "medium.uhdtv": "HDTV"
  "medium.tv": "HDTV"
  "medium.tvrip": "TVRip"
  "medium.dvd": "DVD"
  "medium.dvdr": "DVD"
  "medium.dvdrip": "DVDRip"
  "medium.cd": "未知"
  "medium.other": "未知"

# 分辨率
resolution:
  "resolution.r2160p": "2160p"
  "resolution.r1080p": "1080p"
  "resolution.r1080i": "1080i"
  "resolution.r720p": "720p"
  "resolution.r576p": "576p"
  "resolution.r576i": "576i"
  "resolution.r480p": "480p"
  "resolution.r480i": "480i"
  "resolution.r4320p": "2160p"
  "resolution.r1440p": "1080p"
  "resolution.sd": "480p"
  "resolution.other": "未知"

# 视频编码
video_codec:
  "video.h265": "HEVC / H.265"
  "video.x265": "HEVC / H.265"
  "video.h264": "AVC / H.264"
  "video.x264": "AVC / H.264"
  "video.av1": "AV1"
  "video.vp9": "VP9"
  "video.vc1": "VC-1"
  "video.mpeg2": "MPEG-2"
  "video.other": "未知"

# HDR（站点是单选；PTNexus 侧由标签组合推断，见 colapt.go 的 buildColaptHDR）
hdr:
  "dv+hdr10+": "Dolby Vision + HDR10+"
  "dv+hdr10": "Dolby Vision + HDR10"
  "dv": "Dolby Vision"
  "hdr10+": "HDR10+"
  "hdr10": "HDR10"
  "vivid": "HDR Vivid"
  "hlg": "HLG"
  "hdr": "HDR"
  "unknown": "未知"

# 音轨：自由文本，这里只提供「标准化音频编码 → 站点习惯写法」的显示名。
# 真实提交时 colapt.go 会先用 MediaInfo 音轨补声道（如 "DTS-HD MA 5.1"），取不到才用本表兜底。
audio:
  "audio.aac": "AAC"
  "audio.m4a": "AAC"
  "audio.ac3": "AC-3"
  "audio.ddp": "E-AC-3"
  "audio.ddp_atmos": "E-AC-3 Atmos"
  "audio.truehd": "TrueHD"
  "audio.truehd_atmos": "TrueHD Atmos"
  "audio.dts": "DTS"
  "audio.dts_hd": "DTS-HD MA"
  "audio.dts_hd_ma": "DTS-HD MA"
  "audio.dts_hd_hr": "DTS-HD HR"
  "audio.dtsx": "DTS:X"
  "audio.lpcm": "LPCM"
  "audio.pcm": "LPCM"
  "audio.flac": "FLAC"
  "audio.ape": "APE"
  "audio.alac": "ALAC"
  "audio.wav": "WAV"
  "audio.mp3": "MP3"
  "audio.opus": "Opus"
  "audio.other": "未知"

# 作品分类（枚举，站点只认这五个）
category:
  "category.movie": "movie"
  "category.tv_series": "tv"
  "category.tv_shows": "variety"
  "category.animation": "anime"
  "category.documentaries": "movie"
  "category.sports": "other"
  "category.mv": "other"
  "category.music": "other"
  "category.audiobook": "other"
  "category.playlet": "tv"
  "category.other": "other"

# 字幕语言码（唯一合法值：zh/en/ja/other），由标签推断
subtitles:
  "zh": "zh"
  "en": "en"
  "ja": "ja"

# 兜底：仅当标准化值缺失或未命中时使用。站点各下拉都有「未知」，兜底一律填未知。
defaults:
  medium: "未知"
  resolution: "未知"
  video_codec: "未知"
  hdr: "未知"
  audio: "未知"
  category: "other"
