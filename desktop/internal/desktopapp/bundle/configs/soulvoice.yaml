site_name: "聆音"

# 聆音Club (pt.soulvoice.club) 发种映射配置
# 抓取来源: https://pt.soulvoice.club/upload.php (登录态实测)
# 表单: action=takeupload.php method=post enctype=multipart/form-data
# 文件字段: file
# 关键差异:
#   1) 同 ptfans：两个 name=type 的 select 靠 data-mode 前端二选一显示
#      - id=browsecat data-mode=4 → 种子区(401-409)，字段带 [4] 后缀
#      - id=specialcat data-mode=8 → 特别区(499 有声书 / 500 电子书)，字段带 [8] 后缀
#      引擎只发种子区 mode_4 那一套，[8] 后缀一律不配
#   2) 种子区没有 source_sel(产地/地区)、没有 audiocodec_sel —— 不配，运行时自动跳过
#      (source_sel[8]/audiocodec_sel[8]/processing_sel[8] 属于特别区图书语义：语言/文件格式/类别)
#   3) 媒介选项极少: 12=Other 11=DSD 10=APE/FLAC 4=MiniBD 7=Encode，站内实测绝大多数种子都选 Other
#   4) 分辨率无 720P 档: 1=1080P 2=1080I 3=2160P 4=Other
#   5) 标签是 tags[4][] 数组: 10=应求 9=特效 8=完结 1=禁转 13=原创 2=首发 4=DIY 5=国语 6=中字 7=HDR 12=杜比 11=HLG
#   6) 外链: url 是「IMDb链接」文本框；pt_gen 是 PT-Gen 链接(豆瓣链接填这里)；无 dburl
#   7) 无 mediainfo / technical_info 独立字段(textarea 只有 descr) ——
#      MediaInfo 由 helpers.go shouldInlineMediainfo 白名单内联进简介([quote] 包裹)
#   8) 匿名: NexusPHP 标准 uplver（anonymous.go 默认兜底，无需配置）
#   9) 只有「类型」是必填(带红 *)；质量/标签行均无必填标记

upload_file_field: "file"

form_fields:
  category: "type"
  medium: "medium_sel[4]"
  video_codec: "codec_sel[4]"
  resolution: "standard_sel[4]"
  team: "team_sel[4]"
  name: "name"
  small_descr: "small_descr"
  description: "descr"
  imdb_url: "url"                 # IMDb 链接文本框
  pt_gen: "pt_gen"                # PT-Gen 外链(豆瓣链接会填这里)
  "tags[4][]": "tags[4][]"

source_parsers:
  source_params:
    type:
      source_key: "类型"
    medium:
      source_key: "媒介"
    video_codec:
      source_key: "编码"
    resolution:
      source_key: "分辨率"
    team:
      source_key: "制作组"

  standard_keys:
    type:
      "Movies": "category.movie"
      "Movie": "category.movie"
      "电影": "category.movie"
      "TV Series": "category.tv_series"
      "TV-Series": "category.tv_series"
      "TVSeries": "category.tv_series"
      "电视剧": "category.tv_series"
      "剧集": "category.tv_series"
      "TV Shows": "category.tv_shows"
      "TV-Shows": "category.tv_shows"
      "综艺": "category.tv_shows"
      "Documentaries": "category.documentaries"
      "Documentary": "category.documentaries"
      "纪录片": "category.documentaries"
      "Animate": "category.animation"
      "Animation": "category.animation"
      "动画": "category.animation"
      "动漫": "category.animation"
      "Music": "category.music"
      "音乐": "category.music"
      "Music Video": "category.mv"
      "MV": "category.mv"
      "音乐视频": "category.mv"
      "School": "category.study"
      "教育": "category.study"
      "教学": "category.study"
      "Book": "category.ebook"
      "书籍": "category.ebook"
      "Audiobook": "category.audiobook"
      "有声书": "category.audiobook"
      "Software": "category.software"
      "软件": "category.software"
      "Game": "category.game"
      "游戏": "category.game"
      "Other": "category.other"

    medium:
      "MiniBD": "medium.minibd"
      "Remux": "medium.remux"
      "Encode": "medium.encode"
      "Blu-ray": "medium.bluray"
      "UHD Blu-ray": "medium.uhd_bluray"
      "UHD原盘": "medium.uhd_bluray"
      "BD原盘": "medium.bluray"
      "WEB-DL": "medium.webdl"
      "Web-DL": "medium.webdl"
      "HDTV": "medium.hdtv"
      "DVDR": "medium.dvd"
      "DVD": "medium.dvd"
      "CD": "medium.cd"
      "Track": "medium.track"
      "Other": "medium.other"

    video_codec:
      "H.264": "video.h264"
      "x264": "video.x264"
      "AVC": "video.h264"
      "H.265": "video.h265"
      "x265": "video.x265"
      "HEVC": "video.h265"
      "VC-1": "video.vc1"
      "MPEG-2": "video.mpeg2"
      "Xvid": "video.xvid"
      "AV1": "video.av1"
      "Other": "video.other"

    resolution:
      "8K": "resolution.r4320p"
      "4320p": "resolution.r4320p"
      "4K": "resolution.r2160p"
      "2160p": "resolution.r2160p"
      "1080p": "resolution.r1080p"
