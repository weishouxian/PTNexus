      "Other": "team.other"

mappings:
  # type 分类(种子区 mode_4, id=browsecat)
  #   401=电影 402=电视剧 403=综艺 404=纪录片 405=动漫
  #   406=音乐视频 407=教学 408=音乐 409=其它
  type:
    "category.movie": "401"
    "category.movie_3d": "401"
    "category.tv_series": "402"
    "category.tv_pack": "402"
    "category.tv_shows": "403"
    "category.documentaries": "404"
    "category.animation": "405"
    "category.mv": "406"
    "category.study": "407"
    "category.music": "408"
    "category.stage": "409"
    "category.audiobook": "409"
    "category.ebook": "409"
    "category.game": "409"
    "category.software": "409"
    "category.sports": "409"
    "category.drama": "409"
    "category.other": "409"
    "default": "409"

  # medium_sel[4] 媒介: 12=Other 11=DSD 10=APE/FLAC 4=MiniBD 7=Encode
  # 站点媒介档位很少(站内实测绝大多数种子都用 Other)，只把语义精确对应的填进去，其余兜底 Other
  medium:
    "medium.minibd": "4"
    "medium.encode": "7"
    "medium.encode_2160p": "7"
    "medium.encode_1080p": "7"
    "medium.encode_720p": "7"
    "default": "12"

  # codec_sel[4] 视频编码: 1=H.264 2=H.265 5=Other
  video_codec:
    "video.h264": "1"
    "video.x264": "1"
    "video.avc": "1"
    "video.h265": "2"
    "video.x265": "2"
    "video.hevc": "2"
    "video.vc1": "5"
    "video.mpeg2": "5"
    "video.mpeg4": "5"
    "video.xvid": "5"
    "video.av1": "5"
    "video.other": "5"
    "default": "5"

  # standard_sel[4] 分辨率: 1=1080P 2=1080I 3=2160P 4=Other(无 720P/8K 档)
  resolution:
    "resolution.r1080p": "1"
    "resolution.r1080i": "2"
    "resolution.r2160p": "3"
    "resolution.r4320p": "4"
    "resolution.r720p": "4"
    "resolution.sd": "4"
    "resolution.other": "4"
    "default": "4"

  # team_sel[4] 制作组: 1=HDS 2=CHD 3=FRDS 4=CMCT 5=Other
  team:
    "team.hds": "1"
    "team.chd": "2"
    "team.frds": "3"
    "team.cmct": "4"
    "team.other": "5"
    "default": "5"

  # tags[4][] 标签: 10=应求 9=特效 8=完结 1=禁转 13=原创 2=首发 4=DIY 5=国语 6=中字 7=HDR 12=杜比 11=HLG
  tag:
    "tag.应求": "10"
    "tag.特效": "9"
    "tag.完结": "8"
    "tag.禁转": "1"
    "tag.原创": "13"
    "tag.首发": "2"
    "tag.DIY": "4"
    "tag.国语": "5"
    "tag.中字": "6"
    "tag.简繁中字": "6"
    "tag.HDR": "7"
    "tag.HDR10": "7"
    "tag.杜比": "12"
    "tag.杜比视界": "12"
    "tag.Dolby Vision": "12"
    "tag.DoVi": "12"
    "tag.HLG": "11"
    "default": null

# 标签决定分类: 带动画/动漫标签时必须归到 405 动漫(站点有独立动漫分类)
type_by_tag:
  "tag.动画": "category.animation"
  "tag.动漫": "category.animation"
